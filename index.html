        let currentLang = 'en';

        function initApp() {
            renderLang();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'ar' : 'en';
            
            const htmlRoot = document.getElementById('html-root');
            if (currentLang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', 'ar');
            } else {
                htmlRoot.removeAttribute('dir');
                htmlRoot.setAttribute('lang', 'en');
            }

            renderLang();
            searchFaqs();
        }

        function renderLang() {
            const data = faqsData[currentLang];
            
            document.getElementById('tab-title').textContent = data.tabTitle;
            document.getElementById('page-title').textContent = data.pageTitle;
            document.getElementById('language-label').textContent = data.languageLabel;
            document.getElementById('faq-tag').textContent = data.faqTag;
            document.getElementById('footer-copy').textContent = data.footerCopy;
            document.getElementById('footer-contact').textContent = data.footerContact;
            
            const searchInput = document.getElementById('faq-search');
            searchInput.placeholder = data.searchPlaceholder;

            const faqListContainer = document.getElementById('faq-list');
            faqListContainer.innerHTML = '';

            data.categories.forEach((cat, catIdx) => {
                const catHeader = document.createElement('h2');
                catHeader.className = 'category-title text-white border-b-2 border-white/20 pb-2 mt-10 mb-4 font-bold text-2xl drop-shadow-md';
                catHeader.id = `cat-${catIdx}`;
                catHeader.textContent = cat.title;
                faqListContainer.appendChild(catHeader);

                const catGroup = document.createElement('div');
                catGroup.className = 'category-group';
                catGroup.id = `group-${catIdx}`;

                cat.items.forEach((item) => {
                    const detailEl = document.createElement('details');
                    detailEl.id = item.id;
                    detailEl.className = 'mb-4';

                    const summaryEl = document.createElement('summary');
                    summaryEl.className = 'bg-white font-semibold py-4 px-6 rounded-xl hover:bg-slate-50 cursor-pointer text-[#110729]';
                    summaryEl.textContent = item.question;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'faq-content bg-white/95 rounded-b-xl px-6 pb-5 border-t border-slate-100';
                    contentDiv.innerHTML = item.answer;

                    detailEl.appendChild(summaryEl);
                    detailEl.appendChild(contentDiv);
                    catGroup.appendChild(detailEl);
                });

                faqListContainer.appendChild(catGroup);
            });
        }

        function searchFaqs() {
            const val = document.getElementById('faq-search').value.toLowerCase().trim();
            const data = faqsData[currentLang];

            data.categories.forEach((cat, catIdx) => {
                const groupEl = document.getElementById(`group-${catIdx}`);
                const headerEl = document.getElementById(`cat-${catIdx}`);
                let visibleCount = 0;

                cat.items.forEach((item) => {
                    const detailEl = document.getElementById(item.id);
                    if (!detailEl) return;

                    const questionMatch = item.question.toLowerCase().includes(val);
                    const answerMatch = item.answer.toLowerCase().includes(val);

                    if (questionMatch || answerMatch) {
                        detailEl.classList.remove('hidden');
                        visibleCount++;
                        if (val.length > 1) {
                            detailEl.setAttribute('open', '');
                        } else {
                            detailEl.removeAttribute('open');
                        }
                    } else {
                        detailEl.classList.add('hidden');
                    }
                });

                if (visibleCount > 0) {
                    headerEl.classList.remove('hidden');
                    groupEl.classList.remove('hidden');
                } else {
                    headerEl.classList.add('hidden');
                    groupEl.classList.add('hidden');
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
