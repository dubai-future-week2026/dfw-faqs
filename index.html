        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            background-image: linear-gradient(rgba(17, 10, 42, 0.45), rgba(17, 10, 42, 0.65)), url('background.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #1f2937;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease-in-out;
        }

        [dir="rtl"] {
            font-family: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* NARROWED QUESTION CONTAINER */
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 1.5rem 1rem 1rem 1rem;
        }

        .category-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* SPHERICAL / ROUNDED QUESTION PILLS WITH 20% MORE TRANSPARENCY */
        details {
            background-color: rgba(255, 255, 255, 0.80); /* 20% more transparent */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
            margin-bottom: 0.85rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(8px);
            transition: all 0.25s ease-in-out;
            overflow: hidden;
        }

        details[open] {
            border-radius: 1.5rem;
            background-color: rgba(255, 255, 255, 0.85);
        }

        details:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        summary {
            font-weight: 600;
            font-size: 1.05rem;
            padding: 1rem 1.75rem;
            cursor: pointer;
            color: #1e1b4b;
            list-style: none;
            position: relative;
            outline: none;
            border-radius: 9999px;
            transition: background-color 0.2s ease;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        #html-root:not([dir="rtl"]) summary::after {
            content: '+';
            position: absolute;
            right: 1.75rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: #6b7280;
            font-weight: 400;
            transition: transform 0.2s ease-in-out;
        }

        #html-root:not([dir="rtl"]) details[open] summary::after {
            content: '−';
        }

        [dir="rtl"] summary::after {
            content: '+';
            position: absolute;
            left: 1.75rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: #6b7280;
            font-weight: 400;
            transition: transform 0.2s ease-in-out;
        }

        [dir="rtl"] details[open] summary::after {
            content: '−';
        }

        .faq-content {
            padding: 0 1.75rem 1.25rem 1.75rem;
            color: #374151;
            line-height: 1.625;
            font-size: 0.95rem;
            border-top: 1px solid transparent;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        details[open] .faq-content {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin-top: 0.25rem;
            padding-top: 1rem;
        }

        .faq-content p {
            margin-bottom: 0.75rem;
        }

        .faq-content ul {
            list-style-type: disc;
            margin-bottom: 0.75rem;
        }
        
        #html-root:not([dir="rtl"]) .faq-content ul {
            margin-left: 1.5rem;
        }

        [dir="rtl"] .faq-content ul {
            margin-right: 1.5rem;
        }

        .faq-content li {
            margin-bottom: 0.25rem;
        }

        .pending-note {
            font-style: italic;
            color: #d97706;
            margin-top: 0.5rem;
            background-color: rgba(254, 243, 199, 0.9);
            padding: 0.5rem 0.75rem;
            border-left: 3px solid #f59e0b;
            border-radius: 6px;
        }
        
        [dir="rtl"] .pending-note {
            border-left: none;
            border-right: 3px solid #f59e0b;
        }

        summary:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lang-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .social-icon {
            transition: all 0.2s ease-in-out;
        }
        .social-icon:hover {
            opacity: 1 !important;
            transform: translateY(-2px);
        }
    </style>
</head>

        let currentLang = 'en';

        function initApp() {
            renderLang();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'ar' : 'en';
            
            const htmlRoot = document.getElementById('html-root');
            if (currentLang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', 'ar');
            } else {
                htmlRoot.removeAttribute('dir');
                htmlRoot.setAttribute('lang', 'en');
            }

            renderLang();
            searchFaqs();
        }

        function renderLang() {
            const data = faqsData[currentLang];
            
            document.getElementById('tab-title').textContent = data.tabTitle;
            document.getElementById('page-title').textContent = data.pageTitle;
            document.getElementById('language-label').textContent = data.languageLabel;
            document.getElementById('footer-contact').textContent = data.footerContact;
            
            const searchInput = document.getElementById('faq-search');
            searchInput.placeholder = data.searchPlaceholder;

            const faqListContainer = document.getElementById('faq-list');
            faqListContainer.innerHTML = '';

            data.categories.forEach((cat, catIdx) => {
                const catHeader = document.createElement('h2');
                catHeader.className = 'category-title text-white border-b-2 border-white/20 pb-2 mt-10 mb-4 font-bold drop-shadow-md';
                catHeader.id = `cat-${catIdx}`;
                catHeader.textContent = cat.title;
                faqListContainer.appendChild(catHeader);

                const catGroup = document.createElement('div');
                catGroup.className = 'category-group';
                catGroup.id = `group-${catIdx}`;

                cat.items.forEach((item) => {
                    const detailEl = document.createElement('details');
                    detailEl.id = item.id;

                    const summaryEl = document.createElement('summary');
                    summaryEl.className = 'font-semibold cursor-pointer text-[#110729]';
                    summaryEl.textContent = item.question;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'faq-content';
                    contentDiv.innerHTML = item.answer;

                    detailEl.appendChild(summaryEl);
                    detailEl.appendChild(contentDiv);
                    catGroup.appendChild(detailEl);
                });

                faqListContainer.appendChild(catGroup);
            });
        }

        function searchFaqs() {
            const val = document.getElementById('faq-search').value.toLowerCase().trim();
            const data = faqsData[currentLang];

            data.categories.forEach((cat, catIdx) => {
                const groupEl = document.getElementById(`group-${catIdx}`);
                const headerEl = document.getElementById(`cat-${catIdx}`);
                let visibleCount = 0;

                cat.items.forEach((item) => {
                    const detailEl = document.getElementById(item.id);
                    if (!detailEl) return;

                    const questionMatch = item.question.toLowerCase().includes(val);
                    const answerMatch = item.answer.toLowerCase().includes(val);

                    if (questionMatch || answerMatch) {
                        detailEl.classList.remove('hidden');
                        visibleCount++;
                        if (val.length > 1) {
                            detailEl.setAttribute('open', '');
                        } else {
                            detailEl.removeAttribute('open');
                        }
                    } else {
                        detailEl.classList.add('hidden');
                    }
                });

                if (visibleCount > 0) {
                    headerEl.classList.remove('hidden');
                    groupEl.classList.remove('hidden');
                } else {
                    headerEl.classList.add('hidden');
                    groupEl.classList.add('hidden');
                }
            });
        }

        /* POP-UP MODAL LOGIC */
        function openModal(url, title) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-iframe').src = url;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-iframe').src = '';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
