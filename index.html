<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Future Week (DFW 2026) - FAQs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for English & Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-en: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-ar: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-en);
            background-color: #0f0728;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(120, 50, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(50, 100, 255, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(15, 7, 40, 0.85), rgba(15, 7, 40, 0.92)),
                url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* Arabic Mode Styling */
        html[dir="rtl"] body {
            font-family: var(--font-ar);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #11092a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b2d68;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5b479d;
        }

        /* Banner Styling */
        .dfw-banner {
            background: rgba(26, 16, 56, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Accordion Animations */
        details summary::-webkit-details-marker {
            display: none;
        }

        details {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        details[open] {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 30px -10px rgba(120, 50, 255, 0.3);
        }

        details summary .icon-toggle {
            transition: transform 0.3s ease;
        }

        details[open] summary .icon-toggle {
            transform: rotate(45deg);
        }

        .faq-content {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Flag Icons */
        .flag-uae {
            background-image: url('https://flagcdn.com/w40/ae.png');
        }
        .flag-uk {
            background-image: url('https://flagcdn.com/w40/gb.png');
        }

        .pending-note {
            background: rgba(217, 119, 6, 0.15);
            border-inline-start: 3px solid #f59e0b;
            color: #fcd34d;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>

            </div>
        </div>

        // RENDER FAQS FUNCTION
        function renderFAQs() {
            const container = document.getElementById('faqCategories');
            container.innerHTML = '';

            faqData.forEach((cat, catIdx) => {
                const catElement = document.createElement('div');
                catElement.className = 'faq-category-block space-y-3';

                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'text-xl sm:text-2xl font-bold text-purple-200 border-b border-white/10 pb-2 mb-4 flex items-center gap-2';
                categoryTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-purple-500 inline-block"></span> ${cat.category[currentLang]}`;

                const itemsList = document.createElement('div');
                itemsList.className = 'space-y-3';

                cat.items.forEach((item, itemIdx) => {
                    const details = document.createElement('details');
                    details.className = 'rounded-2xl overflow-hidden transition-all duration-200 faq-item';

                    const summary = document.createElement('summary');
                    summary.className = 'px-5 py-4 cursor-pointer text-white font-semibold text-base sm:text-lg flex justify-between items-center select-none hover:bg-white/5';
                    
                    summary.innerHTML = `
                        <span class="faq-question pr-4 rtl:pl-4 rtl:pr-0">${item.q[currentLang]}</span>
                        <span class="icon-toggle flex-shrink-0 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-purple-300 font-light text-xl">+</span>
                    `;

                    const content = document.createElement('div');
                    content.className = 'faq-content px-5 pb-5 pt-1 text-gray-300 text-sm sm:text-base border-t border-white/5 space-y-2';
                    content.innerHTML = item.a[currentLang];

                    details.appendChild(summary);
                    details.appendChild(content);
                    itemsList.appendChild(details);
                });

                catElement.appendChild(categoryTitle);
                catElement.appendChild(itemsList);
                container.appendChild(catElement);
            });
        }

        // LANGUAGE TOGGLE FUNCTION
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const html = document.documentElement;
            
            const langFlag = document.getElementById('langFlag');
            const langLabel = document.getElementById('langLabel');
            const bannerFaqText = document.getElementById('bannerFaqText');
            const mainTitle = document.getElementById('mainTitle');
            const mainSubtitle = document.getElementById('mainSubtitle');
            const searchInput = document.getElementById('searchInput');
            const noResultsText = document.getElementById('noResultsText');

            if (currentLang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                langFlag.className = 'w-5 h-3.5 bg-cover bg-center rounded-sm flag-uk inline-block shadow-sm';
                langLabel.textContent = 'English';
                bannerFaqText.textContent = 'الأسئلة الشائعة';
                mainTitle.textContent = 'أسبوع دبي للمستقبل (DFW 2026) – الأسئلة الشائعة';
                mainSubtitle.textContent = 'إليك الإجابات الشاملة حول التسجيل، التصاريح، المواقف، أجندة الفعالية والدعم الفني.';
                searchInput.placeholder = 'ابحث في الأسئلة الشائعة...';
                noResultsText.textContent = 'لم يتم العثور على أسئلة تطابق بحثك.';
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', 'en');
                langFlag.className = 'w-5 h-3.5 bg-cover bg-center rounded-sm flag-uae inline-block shadow-sm';
                langLabel.textContent = 'العربية';
                bannerFaqText.textContent = 'FAQs';
                mainTitle.textContent = 'Dubai Future Week (DFW 2026) – FAQs';
                mainSubtitle.textContent = 'Find answers to common questions regarding registration, venue access, parking, agendas, and customer support.';
                searchInput.placeholder = 'Search FAQs...';
                noResultsText.textContent = 'No questions found matching your search.';
            }

            renderFAQs();
            filterFAQs();
        }

        // SEARCH / FILTER FUNCTION
        function filterFAQs() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const categories = document.querySelectorAll('.faq-category-block');
            let totalVisible = 0;

            categories.forEach(catBlock => {
                const items = catBlock.querySelectorAll('.faq-item');
                let catVisibleCount = 0;

                items.forEach(item => {
                    const qText = item.querySelector('.faq-question').textContent.toLowerCase();
                    const aText = item.querySelector('.faq-content').textContent.toLowerCase();

                    if (qText.includes(query) || aText.includes(query)) {
                        item.classList.remove('hidden');
                        catVisibleCount++;
                        if (query.length > 1) {
                            item.setAttribute('open', 'true');
                        }
                    } else {
                        item.classList.add('hidden');
                        item.removeAttribute('open');
                    }
                });

                if (catVisibleCount > 0) {
                    catBlock.classList.remove('hidden');
                    totalVisible += catVisibleCount;
                } else {
                    catBlock.classList.add('hidden');
                }
            });

            const noResults = document.getElementById('noResults');
            if (totalVisible === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            renderFAQs();
        });
    </script>
